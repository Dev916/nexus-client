[package]
name = "agenc-worker"
version = "0.1.7"
edition = "2024"
rust-version = "1.93"
license = "MIT OR Apache-2.0"

[lib]
name = "agenc_worker"
path = "src/lib.rs"

[dependencies]
ed25519-dalek = { version = "2", features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
bs58 = "0.5"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
solana-program = "2"
solana-instruction = "2"
solana-message = { version = "2", features = ["bincode"] }
solana-transaction = { version = "2", default-features = false, features = ["bincode"] }
solana-keypair = "2"
solana-signer = "2"
solana-signature = "2"
solana-hash = "2"
bincode = "1"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[dev-dependencies]
wiremock = "0.6"
