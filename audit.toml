# cargo-audit policy for the nexus-client release binary.
#
# Each ignored advisory is a TRANSITIVE dependency we cannot move without
# upgrading an upstream crate, with a justification for why it does not
# affect this binary's security posture. New advisories (anything not
# listed here) still fail CI. Reviewed 2026-06-12.
[advisories]
ignore = [
  # ed25519-dalek 1.0.1 double-pubkey oracle. Pinned by solana-keypair /
  # solana-signature for THEIR internal keygen. Our security-critical
  # signing path (the auth handshake) uses ed25519-dalek 2.x exclusively
  # and never verifies with 1.0.1, so the oracle is unreachable here.
  "RUSTSEC-2022-0093",
  # curve25519-dalek Scalar sub timing variability. Pinned by the same
  # solana stack (wallet keygen). Not in our challenge-verify path; a
  # local timing side-channel on a host's own keygen is not in the
  # hostile-gateway threat model.
  "RUSTSEC-2024-0344",
  # rustls-webpki CRL-parsing panic. Reached only when parsing a
  # certificate revocation list; the client connects to one fixed
  # gateway host over TLS and never supplies a CRL. Cleared by the
  # tokio-tungstenite upgrade (tracked separately).
  "RUSTSEC-2026-0104",
  # rustls-webpki URI name-constraint over-acceptance. Same stack; the
  # client pins a single known gateway hostname, so a mis-accepted name
  # constraint on some other cert is not exploitable against it.
  "RUSTSEC-2026-0098",
  # rustls-webpki wildcard name-constraint over-acceptance. Same as above.
  "RUSTSEC-2026-0099",
  # rand unsound only when a CUSTOM global logger calls rand::rng() during
  # init. This binary installs no custom logger; the unsound path is
  # unreachable.
  "RUSTSEC-2026-0097",
]
