name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test
      - run: cargo clippy -- -D warnings

  # Build the release Linux target (static musl) and prove it has NO glibc
  # version floor — i.e. it will run on any x86-64 Linux, not just the runner's
  # glibc. Guards against silently regressing back to a glibc-linked binary.
  linux-musl:
    name: linux static (musl) build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build (musl, static)
        run: cargo build --release --target x86_64-unknown-linux-musl
      - name: Assert statically linked (no glibc floor)
        run: |
          BIN=target/x86_64-unknown-linux-musl/release/nexus-client
          DESC=$(file "$BIN")
          echo "$DESC"
          # Rust links musl release binaries as static-pie by default. Both
          # "statically linked" and "static-pie linked" mean self-contained —
          # no glibc, no external .so, no version floor.
          if ! echo "$DESC" | grep -qE "statically linked|static-pie linked"; then
            echo "::error::nexus-client musl binary is NOT static — it would carry a glibc floor"
            exit 1
          fi
          # Belt-and-suspenders: there must be no GLIBC-versioned symbol needs.
          if command -v objdump >/dev/null && objdump -T "$BIN" 2>/dev/null | grep -q "GLIBC_"; then
            echo "::error::musl binary references GLIBC_ symbols — not truly glibc-free"
            exit 1
          fi
          ldd "$BIN" 2>&1 || true   # expect "not a dynamic executable" / "statically linked"
          echo "OK: static (static-pie) musl binary — no glibc floor, runs on any x86-64 Linux."

  audit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # cargo audit (not the rustsec action) so the documented
      # accept-list in audit.toml is honored. New advisories outside
      # that file still fail CI (NX-12).
      - run: cargo install cargo-audit --locked
      - run: cargo audit
